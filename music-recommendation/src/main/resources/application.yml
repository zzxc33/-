server:
  port: 8080

  # 🟢 性能优化：Gzip 压缩
  compression:
    enabled: true
    # Spring Boot 用 contains() 匹配 — JS 有两种：application/javascript 和 text/javascript
    mime-types: "text/html,text/html;charset=UTF-8,text/css,text/css;charset=UTF-8,application/javascript,text/javascript,application/json,image/svg+xml,text/plain"
    min-response-size: 512   # 512 字节以上压缩，JS/CSS/JSON 必过阈值

  # 🟢 HTTP 缓存响应头由 spring.web.resources.cache 统一管理（见下文）

spring:
  application:
    name: music-recommendation

  # 数据源配置（Druid 连接池）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:music_recommendation}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Druid 连接池参数
    druid:
      # 初始连接数
      initial-size: 5
      # 最小空闲连接
      min-idle: 5
      # 最大活动连接数
      max-active: 20
      # 获取连接最大等待时间（毫秒）
      max-wait: 60000
      # 连接保持活跃检查间隔（毫秒）
      time-between-eviction-runs-millis: 60000
      # 连接最小存活时间（毫秒）
      min-evictable-idle-time-millis: 300000
      # 连接有效性检查 SQL
      validation-query: SELECT 1
      validation-query-timeout: 5
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 连接池监控
      pool-prepared-statement-open: true
      max-pool-prepared-statement-per-connection-size: 20
      # 全局监控 + SQL 防火墙
      filters: stat,wall
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
          format-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true
      # 监控页面配置（访问地址：http://localhost:8080/druid/）
      # 开发环境：login-username/login-password 留空即关闭登录验证（直接访问）
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username:
        login-password:
        allow:
        deny:
      # Web URI 监控
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false                  # 🟢 关闭 SQL 日志噪音（Druid stat 已记录慢 SQL）
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false            # 🟢 同上面
    defer-datasource-initialization: true

  # 🟢 Tomcat 性能优化（默认 200 线程，本地开发够用）
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000

  # SQL 初始化
  sql:
    init:
      mode: always

  # Thymeleaf 配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true                       # 🟢 生产启用模板缓存，避免每次请求重编译
    servlet:
      content-type: text/html

  # 🟢 DevTools：禁用 classpath restarts，防止手动 javac 编译的 .class 被缓存拦截
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  # 静态资源路径 + 🟢 性能优化：7 天强缓存 + 处理管线
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 7d
        use-last-modified: true
        cachecontrol:
          max-age: 604800    # 7 天（秒）
          immutable: true
          public: true
      chain:
        compressed: true
        cache: true
        html-optimize: false  # 避免破坏 Thymeleaf

  # ==================== Caffeine 本地内存缓存 ====================
  # Spring Boot 3.x 原生支持，零外部依赖
  # 统一配置：5 分钟过期，最多 1000 条
  cache:
    type: caffeine
    caffeine:
      spec: "maximumSize=1000, expireAfterWrite=300s, recordStats"

# ==================== 自适应推荐权重配置 ====================
# 按用户交互数量分档，动态调整 CF/CB/热度/探索 四路权重
# minInteractions 表示该档的"最少交互数"，按升序排列
# 每档权重总和应接近 1.0
recommender:
  adaptive:
    enabled: true                        # 关闭则回退固定权重
    cold-start-hot-ratio: 0.5            # 冷启动: 热门占比
    tiers:
      # 档0: 极稀疏用户 (0-3 次交互) — 内容为主
      - min-interactions: 0
        cf: 0.05
        cb: 0.45
        popularity: 0.30
        explore: 0.20
      # 档1: 稀疏用户 (4-10 次) — CB+热门平衡
      - min-interactions: 4
        cf: 0.20
        cb: 0.35
        popularity: 0.25
        explore: 0.20
      # 档2: 普通用户 (11-30 次) — CF 初显
      - min-interactions: 11
        cf: 0.40
        cb: 0.25
        popularity: 0.20
        explore: 0.15
      # 档3: 活跃用户 (31-100 次) — CF 主导
      - min-interactions: 31
        cf: 0.55
        cb: 0.20
        popularity: 0.15
        explore: 0.10
      # 档4: 专家用户 (100+ 次) — CF 强势 + 低探索
      - min-interactions: 101
        cf: 0.65
        cb: 0.15
        popularity: 0.12
        explore: 0.08
  # 动态调整因子（额外权重修正，叠加到基础档权重上）
  dynamic:
    cf-empty-penalty: 0.3         # CF 返回 < N 首时，CF 权重 × (1 - penalty)
    cf-min-results: 3             # CF 返回少于这个数就触发 penalty
    active-days: 7                # 最近 N 天有交互 → 略增 CF
    inactive-days: 30             # N 天无交互 → 略降 CF
    cf-boost-active: 0.10         # 活跃用户 CF 权重额外 +0.10
    cf-penalty-inactive: 0.10     # 沉寂用户 CF 权重额外 -0.10

# 验证码配置
kaptcha:
  border: "no"
  border-color: 105,179,90
  border-thickness: 1
  image:
    width: 120
    height: 40
  session:
    key: captcha_code
  text-producer:
    font:
      color: blue
      size: 30
      names: 宋体,楷体,微软雅黑
    char:
      length: 4
      space: 5
  noise:
    color: black
    impl: com.google.code.kaptcha.impl.DefaultNoise
  obscurificator:
    impl: com.google.code.kaptcha.impl.DefaultWaterRipple