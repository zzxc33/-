<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌曲管理 - 管理员后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="logo">
            <a href="/admin">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#F59E0B"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                </div>
                <div>
                    <div class="logo-text">Admin<span>Panel</span></div>
                    <div class="logo-sub">Management Console</div>
                </div>
            </a>
        </div>
        <nav>
            <a href="/admin">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span>
                控制台
            </a>
            <a href="/admin/songs" class="active">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
                歌曲管理
            </a>
            <a href="/admin/users">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                用户管理
            </a>
            <a href="/index">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
                返回前台
            </a>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section-label">系统</div>
        <div class="footer-links">
            <a href="/switch-account" class="link-switch" onclick="return confirm('确认切换账号？')">
                <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></span>
                切换账号
            </a>
            <a href="/logout" class="link-logout" onclick="return confirm('确认退出登录？')">
                <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                退出登录
            </a>
        </div>
    </aside>
    <main class="admin-main">
        <div class="admin-header">
            <h1>
                <span class="header-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                </span>
                歌曲管理
            </h1>
            <div class="admin-user">
                <div class="avatar" th:text="${admin != null ? admin.nickname.substring(0,1) : 'A'}">A</div>
                <div>
                    <div class="admin-name" th:text="${admin != null ? admin.nickname : '管理员'}">管理员</div>
                    <div class="admin-role">SUPER ADMIN</div>
                </div>
                <div class="header-actions">
                    <button class="btn-add" onclick="openModal()">＋ 添加歌曲</button>
                    <a href="/switch-account" class="mini-btn mini-btn-switch" onclick="return confirm('确认切换账号？')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        切换
                    </a>
                    <a href="/logout" class="mini-btn mini-btn-logout" onclick="return confirm('确认退出登录？')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        退出
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="admin-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索歌曲标题或歌手..." oninput="filterTable()">
            </div>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>封面</th>
                        <th>标题</th>
                        <th>歌手</th>
                        <th>风格</th>
                        <th>播放量</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="songTableBody">
                    <tr th:each="song : ${songs}">
                        <td th:text="${song.id}">1</td>
                        <td><img loading="lazy" class="cover-thumb" th:src="${song.coverUrl}" alt=""></td>
                        <td th:text="${song.title}">歌名</td>
                        <td th:text="${song.artist}">歌手</td>
                        <td th:text="${song.genre}">风格</td>
                        <td th:text="${song.playCount}">0</td>
                        <td>
                            <button class="btn-sm btn-edit" th:data-song="${song.toJson()}" onclick="editSong(this)">编辑</button>
                            <form method="post" th:action="@{/admin/songs/delete/{id}(id=${song.id})}" style="display:inline" onsubmit="return confirm('确定要删除这首歌吗？')">
                                <button type="submit" class="btn-sm btn-danger">删除</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- 编辑/添加弹窗 -->
    <div class="modal" id="songModal">
        <div class="modal-content">
            <h2 id="modalTitle">添加歌曲</h2>
            <form id="songForm">
                <input type="hidden" name="id" id="songId">
                <div class="form-group">
                    <label>歌曲标题 *</label>
                    <input type="text" name="title" id="songTitle" required>
                </div>
                <div class="form-group">
                    <label>歌手 *</label>
                    <input type="text" name="artist" id="songArtist" required>
                </div>
                <div class="form-group">
                    <label>专辑</label>
                    <input type="text" name="album" id="songAlbum">
                </div>
                <div class="form-group">
                    <label>风格</label>
                    <select name="genre" id="songGenre">
                        <option value="">选择风格</option>
                        <option value="流行">流行</option>
                        <option value="民谣">民谣</option>
                        <option value="摇滚">摇滚</option>
                        <option value="古风">古风</option>
                        <option value="轻音乐">轻音乐</option>
                        <option value="R&B">R&B</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>时长</label>
                    <input type="text" name="duration" id="songDuration" placeholder="例如 04:30">
                </div>
                <div class="form-group">
                    <label>封面图片链接</label>
                    <input type="text" name="coverUrl" id="songCoverUrl" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea name="description" id="songDescription" rows="2"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn-save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('songModal');
        const modalTitle = document.getElementById('modalTitle');

        function openModal() {
            modalTitle.textContent = '添加歌曲';
            document.getElementById('songForm').reset();
            document.getElementById('songId').value = '';
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function editSong(btn) {
            modalTitle.textContent = '编辑歌曲';
            const song = JSON.parse(btn.getAttribute('data-song'));
            document.getElementById('songId').value = song.id || '';
            document.getElementById('songTitle').value = song.title || '';
            document.getElementById('songArtist').value = song.artist || '';
            document.getElementById('songAlbum').value = song.album || '';
            document.getElementById('songGenre').value = song.genre || '';
            document.getElementById('songDuration').value = song.duration || '';
            document.getElementById('songCoverUrl').value = song.coverUrl || '';
            document.getElementById('songDescription').value = song.description || '';
            modal.classList.add('active');
        }

        document.getElementById('songForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const params = new URLSearchParams(formData).toString();
            fetch('/admin/songs/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    closeModal();
                    location.reload();
                } else {
                    alert('保存失败：' + data.message);
                }
            }).catch(err => {
                alert('请求失败：' + err);
            });
        });

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#songTableBody tr').forEach(function(row) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(q) ? '' : 'none';
            });
        }

        // 点击遮罩关闭
        modal.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</div>
</body>
</html>
