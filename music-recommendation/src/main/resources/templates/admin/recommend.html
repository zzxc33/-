<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>推荐引擎诊断</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .page-title { color: #fff; font-weight: 700; letter-spacing: 1px; }
        .glass-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; color: #fff; }
        .stat-card { background: linear-gradient(135deg, #0f3460, #16213e); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .tier-badge { font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; }
        .tier-0 { background: #6c757d; }
        .tier-1 { background: #0d6efd; }
        .tier-2 { background: #059669; }
        .tier-3 { background: #d97706; }
        .tier-4 { background: #dc2626; }
        .algo-card { background: rgba(255,255,255,0.06); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }
        .algo-header { padding: 10px 16px; border-radius: 12px 12px 0 0; font-weight: 600; }
        .algo-cf { background: linear-gradient(90deg, #3b82f6, #1d4ed8); }
        .algo-als { background: linear-gradient(90deg, #8b5cf6, #6d28d9); }
        .algo-cb { background: linear-gradient(90deg, #10b981, #059669); }
        .algo-hybrid { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .song-item { display: flex; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.88rem; }
        .song-item:last-child { border-bottom: none; }
        .song-rank { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: rgba(255,255,255,0.15); font-size: 0.75rem; margin-right: 8px; }
        .chart-container { position: relative; height: 280px; }
        .btn-eval { background: linear-gradient(90deg, #ef4444, #dc2626); border: none; color: #fff; font-weight: 600; }
        .btn-eval:hover { opacity: 0.9; color: #fff; }
        .eval-result { font-family: 'Courier New', monospace; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">🎵 推荐引擎诊断中心</h2>
        <a href="/" class="text-white-50 small">← 返回首页</a>
    </div>

    <!-- 控制栏 -->
    <div class="glass-card p-3 mb-4 d-flex align-items-center gap-3">
        <span class="text-white-50">选择用户：</span>
        <select id="userId" class="form-select form-select-sm" style="max-width:200px" th:each="u : ${users}">
            <option th:value="${u.id}" th:text="${u.id + ' - ' + u.username}">1 - admin</option>
        </select>
        <button onclick="diagnose()" class="btn btn-primary btn-sm">🔍 诊断</button>
        <button onclick="runEvaluate()" class="btn btn-sm btn-eval">⚡ 离线评估</button>
        <button onclick="runColdStart()" class="btn btn-sm" style="background:linear-gradient(90deg,#06b6d4,#0891b2);border:none;color:#fff;font-weight:600">🧊 冷启动评估</button>
        <span id="tierBadge" class="tier-badge ms-3 d-none"></span>
    </div>

    <!-- 统计 + 图表 -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card p-3 text-center">
                <div class="text-white-50 small">总交互数</div>
                <div id="totalInteractions" class="fs-3 fw-bold text-white">-</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3 text-center">
                <div class="text-white-50 small">CF 候选</div>
                <div id="cfSize" class="fs-3 fw-bold text-primary">-</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3 text-center">
                <div class="text-white-50 small">ALS 候选</div>
                <div id="alsSize" class="fs-3 fw-bold text-white" style="color:#a78bfa !important">-</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3 text-center">
                <div class="text-white-50 small">CB 候选</div>
                <div id="cbSize" class="fs-3 fw-bold text-success">-</div>
            </div>
        </div>
    </div>

    <!-- 图表 -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="glass-card p-3">
                <h6 class="text-white mb-3">📊 四路候选数量对比</h6>
                <div class="chart-container"><canvas id="countChart"></canvas></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="glass-card p-3">
                <h6 class="text-white mb-3">🎯 用户档位分布（交互数）</h6>
                <div class="chart-container"><canvas id="tierChart"></canvas></div>
            </div>
        </div>
    </div>

    <!-- ALS 模型信息 -->
    <div id="alsModelCard" class="glass-card p-3 mb-4 d-none">
        <h6 class="text-white mb-2">🧠 ALS 矩阵分解模型</h6>
        <div class="d-flex gap-4 text-white-50 small">
            <span>🎬 用户数: <b id="alsUsers" class="text-white">-</b></span>
            <span>🎵 歌曲数: <b id="alsSongs" class="text-white">-</b></span>
            <span>🔮 隐因子维度: <b id="alsDim" class="text-white">-</b></span>
            <span>📐 迭代次数: <b class="text-white">20</b></span>
            <span>λ 正则化: <b class="text-white">0.1</b></span>
        </div>
    </div>

    <!-- 四种算法结果 -->
    <div class="row g-3">
        <div class="col-md-6 col-lg-3">
            <div class="algo-card">
                <div class="algo-header algo-cf text-white">① 协同过滤 (UserCF+ItemCF)</div>
                <div id="cfSongs"></div>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="algo-card">
                <div class="algo-header algo-als text-white">② ALS 矩阵分解 (隐因子)</div>
                <div id="alsSongs"></div>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="algo-card">
                <div class="algo-header algo-cb text-white">③ 内容推荐 (风格+歌手)</div>
                <div id="cbSongs"></div>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="algo-card">
                <div class="algo-header algo-hybrid text-white">④ 混合推荐最终结果</div>
                <div id="hybridSongs"></div>
            </div>
        </div>
    </div>

    <!-- 离线评估结果 -->
    <div id="evalCard" class="glass-card p-4 mt-4 d-none">
        <h6 class="text-white mb-3">📐 离线评估 (Hold-Out 20%)</h6>
        <div class="chart-container" style="height:220px"><canvas id="evalChart"></canvas></div>
        <div id="evalTable" class="eval-result mt-3 text-white"></div>
    </div>

    <!-- 冷启动评估结果 -->
    <div id="coldCard" class="glass-card p-4 mt-4 d-none">
        <h6 class="text-white mb-3">🧊 冷启动评估 (随机保留 3 条训练, GT=5)</h6>
        <div class="chart-container" style="height:220px"><canvas id="coldChart"></canvas></div>
        <div id="coldTable" class="eval-result mt-3 text-white"></div>
    </div>
</div>

<script>
const apiBase = '/admin/api/recommend';
let countChart, tierChart, evalChart, coldChart;

function fillAlgo(divId, data) {
    const div = document.getElementById(divId);
    if (!data || !data.songs || data.songs.length === 0) {
        div.innerHTML = '<div class="song-item text-white-50 text-center py-3">无结果</div>';
        return;
    }
    div.innerHTML = data.songs.map((s, i) =>
        `<div class="song-item"><div><span class="song-rank">${i+1}</span><span class="text-white">${s.title}</span> <span class="text-white-50 ms-1">${s.artist}</span></div><span class="text-white-50">${s.genre||''}</span></div>`
    ).join('');
}

function diagnose() {
    const userId = document.getElementById('userId').value;
    fetch(`${apiBase}/diagnose/${userId}`)
        .then(r => r.json())
        .then(r => {
            if (!r.success) return alert('诊断失败: ' + r.message);
            const d = r.data;

            // 基本信息
            document.getElementById('totalInteractions').textContent = d.interactionCount;
            document.getElementById('cfSize').textContent = d.collaborativeFiltering?.resultCount ?? '-';
            document.getElementById('alsSize').textContent = d.alsMatrixFactorization?.resultCount ?? '-';
            document.getElementById('cbSize').textContent = d.contentBased?.resultCount ?? '-';

            // 档位标签
            const tier = d.adaptiveTier || '';
            document.getElementById('tierBadge').textContent = tier;
            document.getElementById('tierBadge').className = 'tier-badge badge ' +
                (tier.includes('档0') ? 'bg-secondary' :
                 tier.includes('档1') ? 'bg-primary' :
                 tier.includes('档2') ? 'bg-success' :
                 tier.includes('档3') ? 'bg-warning' :
                 tier.includes('档4') ? 'bg-danger' : 'bg-dark');
            document.getElementById('tierBadge').classList.remove('d-none');

            // ALS 模型
            if (d.alsModel) {
                document.getElementById('alsModelCard').classList.remove('d-none');
                document.getElementById('alsUsers').textContent = d.alsModel.nUsers;
                document.getElementById('alsSongs').textContent = d.alsModel.nSongs;
                document.getElementById('alsDim').textContent = d.alsModel.latentDim;
            }

            // 算法结果
            fillAlgo('cfSongs', d.collaborativeFiltering);
            fillAlgo('alsSongs', d.alsMatrixFactorization);
            fillAlgo('cbSongs', d.contentBased);
            fillAlgo('hybridSongs', d.hybridFinal);

            // 候选数量柱状图
            drawCountChart(d);
        });
}

function drawCountChart(d) {
    const ctx = document.getElementById('countChart').getContext('2d');
    if (countChart) countChart.destroy();
    countChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['CF邻居', 'ALS隐因子', '内容推荐', '混合最终'],
            datasets: [{
                label: '返回歌曲数',
                data: [
                    d.collaborativeFiltering?.resultCount ?? 0,
                    d.alsMatrixFactorization?.resultCount ?? 0,
                    d.contentBased?.resultCount ?? 0,
                    d.hybridFinal?.resultCount ?? 0
                ],
                backgroundColor: ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b'],
                borderRadius: 6
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#fff' } } },
            scales: {
                y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
            }
        }
    });

    // 档位分布饼图（所有用户交互数分布）
    fetch(`${apiBase}/stats`).then(r => r.json()).then(r => {
        const perUser = r.data.interactionsPerUser || {};
        const buckets = [0, 0, 0, 0, 0];
        Object.values(perUser).forEach(n => {
            if (n <= 3) buckets[0]++;
            else if (n <= 10) buckets[1]++;
            else if (n <= 30) buckets[2]++;
            else if (n <= 100) buckets[3]++;
            else buckets[4]++;
        });
        const ctx2 = document.getElementById('tierChart').getContext('2d');
        if (tierChart) tierChart.destroy();
        tierChart = new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: ['档0: 极稀疏(0-3)', '档1: 稀疏(4-10)', '档2: 普通(11-30)', '档3: 活跃(31-100)', '档4: 专家(100+)'],
                datasets: [{
                    data: buckets,
                    backgroundColor: ['#6c757d', '#0d6efd', '#059669', '#d97706', '#dc2626'],
                    borderWidth: 2, borderColor: '#1a1a2e'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'right', labels: { color: '#fff', font: { size: 11 } } } }
            }
        });
    });
}

// === 共用评估渲染 ===
function renderEvalResult(data, chartId, tableId, chartVar) {
    const algos = (data.algorithms || []).map(a => a.algorithm);
    const metrics = ['precision@10', 'recall@10', 'ndcg@10'];
    const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4'];

    const datasets = metrics.map((m, mi) => ({
        label: m,
        data: (data.algorithms || []).map(a => {
            const key = m.replace('@10', '');
            return a[key] ?? a[m] ?? 0;
        }),
        backgroundColor: colors[mi],
        borderRadius: 4
    }));

    const ctx = document.getElementById(chartId).getContext('2d');
    if (chartVar && chartVar.destroy) chartVar.destroy();
    chartVar = new Chart(ctx, {
        type: 'bar',
        data: { labels: algos, datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#fff' } } },
            scales: {
                y: { beginAtZero: true, ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                x: { ticks: { color: '#fff', maxRotation: 30 }, grid: { color: 'rgba(255,255,255,0.1)' } }
            }
        }
    });

    let html = `<div class="text-white-50 mb-2">耗时 ${data.totalMs}ms · ${data.method}</div><table class="table table-dark table-sm table-bordered"><thead><tr><th>算法</th>${metrics.map(m => `<th>${m}</th>`).join('')}</tr></thead><tbody>`;
    (data.algorithms || []).forEach(a => {
        html += `<tr><td class="fw-bold">${a.algorithm}</td>` +
            metrics.map(m => {
                const v = a[m.replace('@10','')] ?? a[m] ?? 0;
                return `<td>${v.toFixed(4)}</td>`;
            }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById(tableId).innerHTML = html;

    return chartVar;
}

function runEvaluate() {
    const btn = event.target;
    btn.disabled = true; btn.textContent = '⏳ 评估中...';
    fetch(`${apiBase}/evaluate`)
        .then(r => r.json())
        .then(r => {
            btn.disabled = false; btn.textContent = '⚡ 离线评估';
            const d = r.data;
            document.getElementById('evalCard').classList.remove('d-none');
            evalChart = renderEvalResult(d, 'evalChart', 'evalTable', evalChart);
        });
}

function runColdStart() {
    const btn = event.target;
    btn.disabled = true; btn.textContent = '⏳ 冷启动中...';
    fetch(`${apiBase}/evaluate/cold-start`)
        .then(r => r.json())
        .then(r => {
            btn.disabled = false; btn.textContent = '🧊 冷启动评估';
            const d = r.data;
            document.getElementById('coldCard').classList.remove('d-none');
            coldChart = renderEvalResult(d, 'coldChart', 'coldTable', coldChart);
        });
}

// 页面加载后自动选第一个用户
document.addEventListener('DOMContentLoaded', () => {
    const sel = document.getElementById('userId');
    if (sel && sel.options.length > 0) {
        sel.value = sel.options[0].value;
        diagnose();
    }
});
</script>
</body>
</html>
