<!--
  ========== fragments/shortcuts ==========
  键盘快捷键提示
  使用方法：<th:replace="~{fragments/shortcuts :: shortcuts}">
-->
<div class="shortcuts-tip" id="shortcuts-tip" th:fragment="shortcuts">
    <span><kbd>Space</kbd> 播放/暂停</span>
    <span><kbd>←</kbd> <kbd>→</kbd> 切换歌曲</span>
    <span><kbd>R</kbd> 循环模式</span>
    <span><kbd>S</kbd> 收藏歌曲</span>
</div>
