<!--
  ========== fragments/queue-panel ==========
  播放列表展开面板
  使用方法：<th:replace="~{fragments/queue-panel :: queue-panel}">
-->
<div class="queue-panel" id="queue-panel" th:fragment="queue-panel">
    <div class="queue-header">
        <h3 class="queue-title">播放列表 <span class="queue-count" id="queue-count">0 首</span></h3>
        <button class="queue-close" id="queue-close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="queue-list" id="queue-list">
        <div class="queue-empty">
            <div class="empty-icon" style="font-size: 48px; opacity: 0.3; margin-bottom: 16px;">🎵</div>
            <p>播放列表为空，选择歌曲开始播放吧</p>
        </div>
    </div>
</div>
