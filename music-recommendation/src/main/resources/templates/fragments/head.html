<!--
  ========== fragments/head ==========
  公共 <head> 片段
  使用方法：<th:replace="~{fragments/head :: head(pageTitle='页面标题')}">
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '智能音乐推荐 - NIGHTFALL'">智能音乐推荐</title>

    <!-- 预连接 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">

    <!-- 公共样式 -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
