# ============================================================
# 音乐推荐系统 — Docker Compose 一键部署
#
# 组件:
#   1. MySQL 8.0 数据库（持久化到 ./data/mysql 目录）
#   2. Spring Boot 后端（8080 端口，连接 MySQL）
#
# 使用方法:
#   # 后台启动（首次会自动建库建表）
#   docker compose up -d --build
#
#   # 查看日志
#   docker compose logs -f app
#
#   # 停止
#   docker compose down
#
#   # 停止 + 删除数据卷（重置数据库）
#   docker compose down -v
#
#   # 重新构建 + 启动
#   docker compose up -d --build
# ============================================================

services:

  # -------------------- MySQL 8.0 --------------------
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MYSQL_DATABASE: ${DB_NAME:-music_recommendation}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # 主机 3307 → 容器 3306（避开本机已有 MySQL 3306）
    volumes:
      - mysql-data:/var/lib/mysql          # 数据持久化
      - ./docker/mysql-init:/docker-entrypoint-initdb.d  # 首次启动初始化 SQL
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=200
      - --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - music-net

  # -------------------- Spring Boot 后端 --------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # MySQL 健康后再启动
    environment:
      # ==== 数据库连接 ====
      DB_HOST: mysql                 # Docker 网络内直接用服务名
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-music_recommendation}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123}
      # ==== JVM ====
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
      # ==== Spring ====
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - music-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  mysql-data:
    name: music-mysql-data

networks:
  music-net:
    driver: bridge
